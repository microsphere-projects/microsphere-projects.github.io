<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Microsphere">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cf0" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- orbit rings -->
  <g fill="none" stroke="url(#mg)" stroke-width="1.4" opacity=".45">
    <ellipse cx="20" cy="20" rx="15.5" ry="7" />
    <ellipse cx="20" cy="20" rx="15.5" ry="7" transform="rotate(60 20 20)" />
    <ellipse cx="20" cy="20" rx="15.5" ry="7" transform="rotate(120 20 20)" />
  </g>

  <!-- sphere nodes -->
  <g fill="url(#mg)">
    <circle cx="20" cy="20" r="4.6" />
    <circle cx="5.2" cy="16.6" r="2.1" opacity=".85" />
    <circle cx="34.8" cy="23.4" r="2.1" opacity=".85" />
    <circle cx="13.4" cy="7.4" r="1.7" opacity=".7" />
    <circle cx="27.2" cy="32.8" r="1.7" opacity=".7" />
    <circle cx="26.6" cy="7.2" r="1.4" opacity=".55" />
    <circle cx="13.6" cy="33.0" r="1.4" opacity=".55" />
  </g>

  <!-- inner core -->
  <circle cx="20" cy="20" r="1.9" fill="#fff" opacity=".92" />
</svg>
